# Keep node state in memory: every boot (orb wake) joins as a new temporary
# node, and project snapshots never contain a node identity. --statedir only
# holds Tailscale SSH host keys, so they stay stable across wakes of one orb;
# srv's template sanitizer strips /var/lib/tailscale from project snapshots.
[Service]
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=mem: --statedir=/var/lib/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
