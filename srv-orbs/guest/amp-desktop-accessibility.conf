# /etc/systemd/system/run-.service.d/amp-desktop-accessibility.conf
# Amp's /opt/amp-desktop/launch-app starts Desktop apps (Chrome, Firefox, VS
# Code, ...) as transient `systemd-run` units with a fixed environment, without
# the session's D-Bus address. This prefix drop-in applies to every transient
# run-*.service: it makes Chrome and Qt expose their accessibility trees and
# points every toolkit at the Desktop's accessibility bus, which labwc's
# autostart links to this fixed path (Amp's runtime directory never changes).
[Service]
Environment=ACCESSIBILITY_ENABLED=1
Environment=QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
Environment=AT_SPI_BUS_ADDRESS=unix:path=/home/user/.cache/amp/desktop/runtime/at-spi-bus
