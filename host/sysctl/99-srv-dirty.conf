# srv host: raise the dirty-page caps. Desktop distros often ship small ones
# (Omarchy's 99-omarchy-sysctl.conf: 64M/256M); with many Firecracker VMs
# writing at once, a 256M cap throttles VM I/O threads in balance_dirty_pages.
# Install as /etc/sysctl.d/99-srv-dirty.conf so it loads after such files.
vm.dirty_background_bytes=1073741824
vm.dirty_bytes=4294967296
